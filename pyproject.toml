[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-downloader"
version = "0.1.0"
description = "Lightweight, resumable personal music archive and playlist synchronizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1.0",
  "mutagen>=1.47,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1.0",
]

[project.scripts]
music-downloader = "music_downloader.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/music_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
